# ODCS v3.x — uts_silver.result (OneRoster result / notas)
kind: DataContract
apiVersion: v3.0.2
id: urn:datacontract:uts:silver_result
name: UTS Silver Result
version: 1.0.0
status: active
description:
  purpose: "Resultado académico canónico (OneRoster) de Moodle. Base de retención y AES."

schema:
  - name: result
    physicalType: table
    description: "Calificación de un estudiante en un ítem de evaluación."
    properties:
      - name: student_moodle_id
        logicalType: integer
        physicalType: int
        required: true
        description: "Id de usuario en Moodle."
      - name: email
        logicalType: string
        physicalType: string
        required: true
        description: "Correo del estudiante. PII."
        logicalTypeOptions:
          pattern: '^[^@]+@[^@]+\.[^@]+$'
      - name: course_sourced_id
        logicalType: integer
        physicalType: int
        required: true
      - name: line_item_id
        logicalType: integer
        physicalType: int
        required: true
      - name: nota
        logicalType: number
        physicalType: double
        required: true
        description: "Nota en escala LATAM 0-20."
        logicalTypeOptions:
          minimum: 0.0
          maximum: 20.0
      - name: scored_at
        logicalType: string
        physicalType: string
        required: false
